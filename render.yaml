# Render Blueprint - activity tracker
# Docs: https://docs.render.com/blueprint-spec

services:
  # Spring Boot backend API
  - type: web
    name: csci602-activity-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      # Database connection — references the PostgreSQL service below
      - key: DB_HOST
        fromDatabase:
          name: csci602-activity-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: csci602-activity-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: csci602-activity-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: csci602-activity-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: csci602-activity-db
          property: password
      # Activate the "render" Spring profile
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false

  # React (Vite) static frontend
  - type: web
    name: csci602-activity-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback — send all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html

# PostgreSQL database (free tier)
databases:
  - name: csci602-activity-db
    plan: free
