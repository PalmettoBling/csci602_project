info:
  app:
    description: Template Spring Boot API for use of CSCI 602
    name: csci-602
    version: 1.0.0
management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: openapi, swagger-ui
security:
  jwt:
    # ===================================================================
    # TEST-ONLY VALUE -- NOT A SECRET AND NOT A CREDENTIAL.
    # ===================================================================
    # This exists solely so the ghci profile used by GitHub Actions can sign
    # and verify tokens without a repository secret being configured. It is
    # committed to a public repository, so treat it as known to everyone.
    # Never set this value in any deployed environment: those read the key
    # from the JWT_SECRET environment variable instead (see application.yaml).
    secret: "ghci-test-only-not-a-real-secret-0123456789abcdef"
server:
  port: 5001
spring:
  application:
    name: csci-602
  datasource:
    password: admin
    url: jdbc:postgresql://localhost:5433/testdb
    username: admin
  mvc:
    servlet:
      load-on-startup: 1
springdoc:
  packagesToScan: edu.citadel.api
  pathsToMatch: /v1, /**
  show-actuator: true