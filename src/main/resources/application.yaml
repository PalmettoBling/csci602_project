info:
  app:
    description: Template Spring Boot API for use of CSCI 602
    name: csci-602
    version: 1.0.0
management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: openapi, swagger-ui
security:
  cors:
    # Origins permitted to call this API from a browser. The Vite dev server.
    allowed-origins: http://localhost:5173
  jwt:
    # HMAC signing secret. THERE IS DELIBERATELY NO DEFAULT HERE: the value has
    # to come from the JWT_SECRET environment variable so that no usable signing
    # key ever lives in this repository. If JWT_SECRET is unset the application
    # fails to start rather than signing tokens with a guessable key.
    secret: ${JWT_SECRET}
    # Token lifetime. Short enough to limit the damage of a stolen token.
    expiration: 1h
server:
  port: 5001
spring:
  application:
    name: csci-602
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/csci602}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
  mvc:
    servlet:
      load-on-startup: 1
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
springdoc:
  packagesToScan: edu.citadel.api
  pathsToMatch: /v1, /**
  show-actuator: true
